name: dbt CD

on:
  push:
    branches: [main]
    paths:
      - 'dbt_sales_mart/**'
      - 'cd/profiles.yml'
      - '.github/workflows/dbt-cd.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    defaults:
      run:
        working-directory: dbt_sales_mart
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CD_USER }}
      SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CD_PRIVATE_KEY_PASSPHRASE }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_CD_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_CD_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_CD_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_CD_SCHEMA }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/cd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Write Snowflake private key to disk
        run: |
          mkdir -p "$RUNNER_TEMP/snowflake_keys"
          printf '%s\n' "${{ secrets.SNOWFLAKE_CD_PRIVATE_KEY }}" > "$RUNNER_TEMP/snowflake_keys/rsa_key.p8"
          chmod 600 "$RUNNER_TEMP/snowflake_keys/rsa_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_keys/rsa_key.p8" >> "$GITHUB_ENV"

      - name: dbt deps
        run: dbt deps

      - name: dbt debug
        run: dbt debug

      - name: dbt build (production)
        run: dbt build

      - name: Publish manifest for slim CI
        run: |
          rm -rf "$RUNNER_TEMP/previous_release_artifacts"
          mkdir -p "$RUNNER_TEMP/previous_release_artifacts"
          cp target/manifest.json "$RUNNER_TEMP/previous_release_artifacts/manifest.json"
          cd "$RUNNER_TEMP/previous_release_artifacts"
          git init -q
          git checkout -q -b previous_release_artifacts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -q -m "Update manifest from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin previous_release_artifacts

      - name: dbt docs generate
        run: dbt docs generate

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dbt_sales_mart/target

  publish-docs:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
