name: dbt CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'dbt_sales_mart/**'
      - 'ci/profiles.yml'
      - '.github/workflows/dbt-ci.yml'

env:
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_CI_USER }}
  SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY_PASSPHRASE }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_CI_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_CI_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_CI_WAREHOUSE }}
  SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_CI_SCHEMA }}
  DBT_PROFILES_DIR: ${{ github.workspace }}/ci

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dbt_sales_mart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake and sqlfluff
        run: pip install dbt-snowflake sqlfluff sqlfluff-templater-dbt

      - name: Write Snowflake private key to disk
        run: |
          mkdir -p "$RUNNER_TEMP/snowflake_keys"
          printf '%s\n' "${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}" > "$RUNNER_TEMP/snowflake_keys/rsa_key.p8"
          chmod 600 "$RUNNER_TEMP/snowflake_keys/rsa_key.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/snowflake_keys/rsa_key.p8" >> "$GITHUB_ENV"

      - name: dbt deps
        run: dbt deps

      - name: dbt debug
        run: dbt debug

      - name: sqlfluff lint
        run: sqlfluff lint models

      - name: Fetch previous release manifest (for slim CI)
        id: previous_manifest
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: previous_release_artifacts
          path: previous_artifacts

      - name: dbt build (slim, changed models only)
        run: |
          if [ "${{ steps.previous_manifest.outcome }}" = "success" ] && [ -f ../previous_artifacts/manifest.json ]; then
            echo "Previous release manifest found — building only changed models and their downstream dependents."
            dbt build --select "state:modified+" --state ../previous_artifacts --defer --favor-state
          else
            echo "No previous release manifest found (first run, or branch not yet created) — running a full build."
            dbt build
          fi
